<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Ledgerline">
  <defs>
    <!-- emerald -> fresh green -> warm gold. No blue, no violet. -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064E3B"/>
      <stop offset=".48" stop-color="#12A06A"/>
      <stop offset="1" stop-color="#F2C14E"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".34"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7F7DD"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="1" stop-color="#F5B83D"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#032E22" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="118" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="232" rx="118" fill="url(#gloss)"/>
  <!-- the "L": a ledger spine and its base line -->
  <g filter="url(#soft)">
    <rect x="132" y="112" width="68" height="290" rx="22" fill="url(#paper)"/>
    <rect x="132" y="334" width="238" height="68" rx="22" fill="url(#paper)"/>
  </g>
  <!-- two equal lines: debit = credit -->
  <g filter="url(#soft)">
    <rect x="246" y="140" width="136" height="38" rx="19" fill="url(#gold)"/>
    <rect x="246" y="206" width="136" height="38" rx="19" fill="url(#gold)"/>
  </g>
  <!-- balance dot -->
  <circle cx="400" cy="298" r="14" fill="#FFE9A8"/>
</svg>
